backend:
  base_url: http://127.0.0.1:8000/v1
  model: Qwen/Qwen3-0.6B
  model_revision: c1899de289a04d12100db370d81485cdf75e47ca
  tokenizer_revision: c1899de289a04d12100db370d81485cdf75e47ca
  request_timeout_s: 180.0

server:
  host: 127.0.0.1
  port: 8000
  gpu_memory_utilization: 0.5
  max_model_len: 4096
  max_num_seqs: 16
  # Experiment D sets these explicitly in separate server configurations.
  max_num_batched_tokens: null
  enable_chunked_prefill: null
  enable_prefix_caching: null
  dtype: bfloat16
  enforce_eager: true

router:
  policy: fcfs
  listen_host: 127.0.0.1
  listen_port: 8080
  max_in_flight: 16
  queue_capacity: 256

admission:
  # Optional external max-token clipping. Disabled by default so all earlier
  # experiments preserve their original backend request semantics.
  clip_enabled: false
  clip_max_tokens: 2048
  clip_source: advertised
  clip_estimator_path: null
  # Adaptive clipping is inert by default. Its queue-depth defaults are calibrated
  # for the Week 7 design but are excluded from the legacy hash while disabled.
  adaptive_clip_enabled: false
  adaptive_clip_signal: queue_depth_ewma
  adaptive_clip_caps: [1536, 1024, 512]
  adaptive_clip_tighten_thresholds: [1.0, 2.0, 3.0]
  adaptive_clip_relax_thresholds: [0.25, 0.75, 1.5]
  adaptive_clip_ewma_tau_s: 6.0
  adaptive_clip_relax_hold_s: 30.0
  adaptive_clip_capacity_rps: null

slo_aware:
  # Coarse service-time estimates; normalization makes scoring robust to exact values.
  input_token_seconds: 0.0005
  output_token_seconds: 0.01
  cost_weight: 1.0
  slack_weight: 1.0
  waiting_weight: 1.0
  aging_threshold_s: 30.0
  disable_length_estimate: false
  # Number of graduated aging tiers; 1 reproduces the original single hard tier.
  aging_levels: 1

workload:
  arrival_process: fixed
  request_rate_rps: 1.0
  total_requests: 20
  interactive_fraction: 0.8
  random_seed: 20250825
  warmup_requests: 5
  repetitions: 3
  interactive:
    input_tokens:
      minimum: 64
      maximum: 256
    output_tokens:
      minimum: 32
      maximum: 128
    ttft_slo_ms: 1500.0
    end_to_end_slo_ms: 10000.0
  batch:
    input_tokens:
      minimum: 512
      maximum: 2048
    output_tokens:
      minimum: 128
      maximum: 512
    ttft_slo_ms: 10000.0
    end_to_end_slo_ms: 120000.0

metrics:
  output_directory: results/raw
  gpu_sample_interval_s: 0.5
  save_jsonl: true
  save_csv: true
