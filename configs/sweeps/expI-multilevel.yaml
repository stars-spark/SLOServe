# Experiment I: graduated aging tiers with one shared oldest-first ceiling.
base_config: ../base.yaml
base_overrides:
  router:
    policy: slo_aware
    max_in_flight: 4
  workload:
    arrival_process: poisson
    request_rate_rps: 3.0
    total_requests: 60
    interactive_fraction: 0.5
    random_seed: 20250825
    warmup_requests: 5
    repetitions: 3
  slo_aware:
    aging_threshold_s: 3.0
  metrics:
    output_directory: results/raw/week4-expI-multilevel

points:
  - label: levels-1
    policy: slo_aware
    aging_levels: 1
  - label: levels-2
    policy: slo_aware
    aging_levels: 2
  - label: levels-3
    policy: slo_aware
    aging_levels: 3
  - label: levels-5
    policy: slo_aware
    aging_levels: 5
