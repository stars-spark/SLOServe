# Experiment D (chunked): vLLM engine params {'max_num_seqs': 16, 'enable_chunked_prefill': True} at rps=3.0. serve with serve-D-chunked.yaml.
base_config: serve-D-chunked.yaml
base_overrides:
  router:
    max_in_flight: 4
  workload:
    request_rate_rps: 3.0
    total_requests: 60
    interactive_fraction: 0.5
    random_seed: 20250825
    warmup_requests: 5
    repetitions: 3
  slo_aware:
    aging_threshold_s: 3.0
  metrics:
    output_directory: results/raw/week3-expD-chunked
points:
- label: fcfs-chunked
  policy: fcfs
- label: slo-chunked
  policy: slo_aware
