# Experiment E: SLO-aware component ablations at one fixed load point.
base_config: ../base.yaml
base_overrides:
  router:
    policy: slo_aware
    max_in_flight: 4
  workload:
    request_rate_rps: 2.0
    total_requests: 60
    interactive_fraction: 0.5
    random_seed: 20250825
    warmup_requests: 5
    repetitions: 3
  slo_aware:
    aging_threshold_s: 3.0
  metrics:
    output_directory: results/raw/week3-expE-ablation

points:
  - label: full
    policy: slo_aware
  - label: no-slack
    policy: slo_aware
    slack_weight: 0.0
  - label: no-aging
    policy: slo_aware
    # This exceeds any planned run duration and therefore prevents hard-aging promotion.
    aging_threshold_s: 1000000.0
  - label: no-length-estimate
    policy: slo_aware
    disable_length_estimate: true
