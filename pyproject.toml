[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "sloserve"
version = "0.1.0"
description = "An external SLO-aware admission, queueing, and routing layer for vLLM."
readme = "README.md"
requires-python = ">=3.11,<3.12"
authors = [{ name = "SLOServe contributors" }]
dependencies = [
    "pydantic>=2.10,<3",
    "PyYAML>=6.0.2,<7",
]

[project.scripts]
sloserve = "sloserve.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "ruff>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/sloserve"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
